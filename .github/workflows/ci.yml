name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which current sdkmanager no longer lists.
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, Robolectric and pipeline tests
        run: ./gradlew jvmTest testDebugUnitTest --stacktrace
      - name: Install FFmpeg for the audio encoder tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Audio production tool tests
        run: python3 -m unittest discover -s tools/tts -p "test_*.py"
      - name: Lint
        run: ./gradlew lintDebug
      - name: Debug build
        run: ./gradlew :apps:german5000:assembleDebug
      - name: Content release gate (expected to fail until the full catalog exists)
        continue-on-error: true
        run: ./gradlew :tools:content-pipeline:run --args="validate $GITHUB_WORKSPACE/content/german5000/source release"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            apps/german5000/build/outputs/apk/debug/*.apk
