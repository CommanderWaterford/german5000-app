org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- German5000 release identity (owner-controlled; see docs/RELEASE.md) ---
# The default application ID is a deliberate placeholder. Release bundles refuse
# to build until an owner-controlled ID is supplied, e.g. -Pg5000.applicationId=...
g5000.applicationId=invalid.placeholder.german5000
# Base64 Play Console licensing key used for client-side purchase signature checks.
# Leave empty during development; verification then relies on Billing responses only.
g5000.playLicenseKey=
